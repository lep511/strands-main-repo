[project]
name = "strands-mcp-sample"
version = "0.1.0"
description = "Strands Agent backend for an MCP App — exposed via FastAPI"
requires-python = ">=3.13"
dependencies = [
    "strands-agents>=0.1",
    "strands-agents-tools>=0.1",
    "fastapi>=0.115",
    "uvicorn>=0.34",
]

[project.scripts]
strands-mcp-sample = "strands_mcp_sample.service:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
