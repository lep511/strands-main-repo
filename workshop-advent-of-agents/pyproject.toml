[project]
name = "workshop-advent-of-agents"
version = "0.1.0"
description = "Advent of Agents (Season 3) adapted to Strands Agents + Amazon Bedrock, run with uv"
readme = "README.md"
authors = [
    { name = "lep511", email = "estebanpbuday@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "strands-agents[a2a,otel]>=1.61.0",
    "tzdata>=2026.5",
    "uvicorn>=0.54.0",
]

[project.scripts]
workshop-advent-of-agents = "workshop_advent_of_agents:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
deploy = [
    "bedrock-agentcore>=1.24.1",
]
dev = [
    "moto[secretsmanager]>=5.2.4",
    "pytest>=9.1.1",
]
evals = [
    "strands-agents-evals>=1.6.0",
]
