[project]
name = "agent-mcp"
version = "0.1.0"
description = "MCP server (spec 2026-07-28) backed by a Strands Agent — two-process architecture"
readme = "README.md"
authors = [
    { name = "lep511", email = "estebanpbuday@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
mcp-server = [
    "fastmcp==4.0.0b1",
    "httpx>=0.27",
]
agent-service = [
    "strands-agents>=0.1",
    "strands-agents-tools>=0.1",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "rich>=13",
]

[project.scripts]
agent-mcp = "agent_mcp.mcp_server:main"
agent-service = "agent_mcp.agent_service:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
conflicts = [
    [
        { extra = "mcp-server" },
        { extra = "agent-service" },
    ],
]
