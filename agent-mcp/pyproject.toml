[project]
name = "agent-mcp"
version = "0.2.0"
description = "Customer-service MCP server (spec 2026-07-28, FastMCP 4) plus a Strands agent client"
readme = "README.md"
authors = [
    { name = "lep511", email = "estebanpbuday@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    # Server side: FastMCP 4 speaks the sessionless 2026-07-28 protocol and
    # still negotiates the legacy handshake for older clients.
    "fastmcp>=4.1.0,<5",
    # Client side: strands-agents >= 1.61 runs on the mcp 2.x SDK (mcp<2.2),
    # so both halves now share one environment.
    "strands-agents>=1.61.0",
    "strands-agents-tools>=0.8.9",
    "python-dotenv>=1.0",
    "rich>=13",
]

[project.scripts]
agent-mcp = "agent_mcp.mcp_server:main"
agent-service = "agent_mcp.agent_service:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
